<!-- MENU -->

        menu.classList.toggle('active');
        hamburger.classList.toggle('open');
    });
</script>

<!-- FORMULAIRE WHATSAPP -->
<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const telephone = document.getElementById("telephone").value.trim();
    const regex = /^[0-9]{10}$/;

    if (!regex.test(telephone)) {
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent =
            "Numéro invalide (10 chiffres requis)";
        return;
    }

    const message = `
Nom : ${nom.value}
Prénom : ${prenom.value}
Téléphone : ${telephone}
Message : ${message.value}
    `;

    window.open(
        "https://wa.me/2250758774741?text=" + encodeURIComponent(message),
        "_blank"
    );
});
</script>

<!-- CARROUSEL -->
<script>
    const track = document.getElementById("carouselTrack");
    const nextBtn = document.querySelector(".carousel-btn.next");
    const prevBtn = document.querySelector(".carousel-btn.prev");

    const scrollAmount = 270;

    nextBtn.addEventListener("click", () => {
        track.scrollBy({ left: scrollAmount, behavior: "smooth" });
    });

    prevBtn.addEventListener("click", () => {
        track.scrollBy({ left: -scrollAmount, behavior: "smooth" });
    });
</script>

<!-- JAVASCRIPT FORMULAIRE -->

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let nom = document.getElementById("nom").value.trim();
    let prenom = document.getElementById("prenom").value.trim();
    let telephone = document.getElementById("telephone").value.trim();
    let message = document.getElementById("message").value.trim();
    let error = document.getElementById("error");

    // Validation du numéro (Côte d'Ivoire : 10 chiffres)
    let regexTelephone = /^[0-9]{10}$/;

    if (!regexTelephone.test(telephone)) {
        error.style.display = "block";
        error.textContent = "Veuillez entrer un numéro de téléphone valide (10 chiffres).";
        return;
    } else {
        error.style.display = "none";
    }

    let texte =
`Bonjour, je vous contacte depuis votre site web.
Nom : ${nom}
Prénom : ${prenom}
Téléphone : ${telephone}
Message : ${message}`;

    let numeroWhatsApp = "2250758774741"; // Ton numéro WhatsApp avec indicatif
    let url = "https://wa.me/" + numeroWhatsApp + "?text=" + encodeURIComponent(texte);

    window.open(url, "_blank");
});
</script>
